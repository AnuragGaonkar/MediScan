<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>MediScan — Medical Image Disease Detection</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="MediScan is an AI-powered medical image analysis platform that classifies scan types and detects diseases from CT, X-ray, MRI images. Built using custom softmax-based machine learning models for fast, accurate, and interpretable diagnosis."

    <meta
      name="keywords"
      content="medical image classification, disease detection, CT scan analysis, X-ray AI, MRI diagnosis, healthcare AI, medical imaging"
    />

    <!-- Author -->
    <meta name="author" content="MediScan" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:title" content="MediScan — Medical Image Disease Detection" />
    <meta
      property="og:description"
      content="Upload a medical scan and instantly detect whether it is diseased or normal. MediScan uses lightweight, interpretable machine learning models for medical image classification and disease prediction."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mediscan-5f5o.onrender.com" />
    <!-- Optional: Add when you have a banner -->
    <!-- <meta property="og:image" content="https://yourdomain.com/preview.png" /> -->

    <meta name="twitter:title" content="MediScan — Medical Image Disease Detection" />

      name="twitter:description"
      content="AI-powered classification and disease detection for medical images including CT, X-ray, and MRI scans."
